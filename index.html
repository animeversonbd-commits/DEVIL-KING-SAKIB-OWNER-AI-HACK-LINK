    <style>
        :root {
            --cyan-main: #ffd60a;
            --cyan-dark: #b8860b;
            --cyan-soft: #ffec8b;
            --bg-dark: #0a0700;
            --neon-green: #ffd60a;
            --neon-cyan: #ffd60a;
            --gold: #ffd60a;
            --gold-soft: #ffec8b;
            --gold-deep: #b8860b;
            --green: #00ff4c;
            --red: #ff0033;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Space Grotesk', sans-serif;
            color: #fff;
        }

        /* IFRAME */
        iframe.bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        /* ─── COMMON PANEL STYLES (SIGNAL & HISTORY) ─── */
        .drag-wrapper {
            position: fixed;
            width: 250px;
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0 15px 30px rgba(0, 0, 0, .9));
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            top: 0;
            left: 0;
            will-change: transform;
            transform: translate3d(0, 0, 0);
            contain: layout style paint;
        }

        .drag-wrapper.dragging {
            z-index: 2500;
        }

        .drag-wrapper.dragging .modal-outer {
            animation: none;
            box-shadow: 0 0 28px rgba(255, 214, 10, .95), 0 0 70px rgba(255, 214, 10, .45), 0 0 120px rgba(255, 214, 10, .22), inset 0 0 40px rgba(0, 0, 0, .95);
        }

        .modal-outer {
            width: 100%;
            background: linear-gradient(180deg, #12100a 0%, #050300 100%);
            border: 2px solid var(--gold);
            border-radius: 18px;
            padding: 15px 13px 12px;
            box-shadow: 0 0 22px rgba(255, 214, 10, .75), 0 0 55px rgba(255, 214, 10, .35), 0 0 110px rgba(255, 214, 10, .2), inset 0 0 40px rgba(0, 0, 0, .95);
            position: relative;
            pointer-events: auto;
            background-image: linear-gradient(rgba(255, 214, 10, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 214, 10, .06) 1px, transparent 1px), linear-gradient(180deg, #12100a 0%, #050300 100%);
            background-size: 14px 14px, 14px 14px, 100% 100%;
            animation: goldPulse 2.4s ease-in-out infinite;
        }

        .modal-outer::before,
        .modal-outer::after,
        .modal-inner-brk::before,
        .modal-inner-brk::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            border: 3px solid var(--gold);
            border-radius: 4px;
            pointer-events: none;
            filter: drop-shadow(0 0 6px rgba(255, 214, 10, .9));
        }

        .modal-outer::before {
            top: -3px;
            left: -3px;
            border-right: none;
            border-bottom: none;
        }

        .modal-outer::after {
            top: -3px;
            right: -3px;
            border-left: none;
            border-bottom: none;
        }

        .modal-inner-brk::before {
            bottom: -3px;
            left: -3px;
            border-right: none;
            border-top: none;
            position: absolute;
            width: 22px;
            height: 22px;
        }

        .modal-inner-brk::after {
            bottom: -3px;
            right: -3px;
            border-left: none;
            border-top: none;
            position: absolute;
            width: 22px;
            height: 22px;
        }

        .modal-inner-brk {
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: 18px;
        }

        @keyframes goldPulse {

            0%,
            100% {
                box-shadow: 0 0 22px rgba(255, 214, 10, .75), 0 0 55px rgba(255, 214, 10, .35), 0 0 110px rgba(255, 214, 10, .2), inset 0 0 40px rgba(0, 0, 0, .95);
            }

            50% {
                box-shadow: 0 0 32px rgba(255, 214, 10, .95), 0 0 75px rgba(255, 214, 10, .5), 0 0 140px rgba(255, 214, 10, .28), inset 0 0 40px rgba(0, 0, 0, .95);
            }
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            cursor: grab;
            padding-bottom: 8px;
            margin-bottom: 10px;
            border-bottom: 1.5px solid rgba(255, 214, 10, .75);
            box-shadow: 0 1px 8px -2px rgba(255, 214, 10, .5);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .header:active {
            cursor: grabbing;
        }

        .drag-wrapper .header {
            touch-action: none;
        }

        .drag-wrapper.dragging .header {
            cursor: grabbing;
        }

        .title-container {
            display: flex;
            flex-direction: column;
            min-width: 0;
            flex: 1;
            pointer-events: none;
        }

        .title-main {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 13px;
            color: var(--cyan-main);
            letter-spacing: .5px;
            text-shadow: 0 0 12px rgba(255, 214, 10, .7);
            line-height: 1.2;
            word-break: break-word;
        }

        .title-sub {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 9.5px;
            color: #fff;
            letter-spacing: 4px;
            margin-top: 2px;
            text-shadow: 0 0 4px rgba(255, 255, 255, .35);
        }

        /* BUTTON CONTROLS IN HEADER */
        .header-actions {
            display: flex;
            gap: 5px;
            align-items: center;
            pointer-events: auto;
        }

        .toggle-hist-btn {
            padding: 3px 6px;
            border-radius: 6px;
            background: rgba(255, 214, 10, .15);
            border: 1px solid rgba(255, 214, 10, .8);
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 800;
            color: #ffd60a;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(255, 214, 10, .3);
            transition: .15s;
        }

        .toggle-hist-btn:active {
            background: rgba(255, 214, 10, .35);
            transform: scale(.92);
        }

        .close-x {
            width: 24px;
            height: 24px;
            border-radius: 7px;
            background: rgba(255, 214, 10, .08);
            border: 1.5px solid rgba(255, 214, 10, .8);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: .15s;
            box-shadow: 0 0 8px rgba(255, 214, 10, .3);
        }

        .close-x:active {
            background: rgba(255, 214, 10, .25);
            transform: scale(.9);
        }

        /* LIVE ROW */
        .live-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 214, 10, .05);
            border: 1px solid rgba(255, 214, 10, .4);
            border-radius: 9px;
            padding: 7px 12px;
            margin-bottom: 10px;
            box-shadow: inset 0 0 12px rgba(255, 214, 10, .06);
        }

        .live-left {
            display: flex;
            align-items: center;
            gap: 7px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 11px;
            color: #fff;
            letter-spacing: 1.5px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffd60a;
            box-shadow: 0 0 9px #ffd60a;
            animation: blink 1.2s ease-in-out infinite;
        }

        .live-id {
            font-family: 'Space Grotesk', monospace;
            font-weight: 700;
            font-size: 13px;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 0 0 6px rgba(255, 255, 255, .3);
        }

        /* PREDICTION PANEL */
        .pred-panel {
            background: rgba(0, 0, 0, .55);
            border: 1px solid rgba(255, 214, 10, .35);
            border-radius: 11px;
            padding: 12px 11px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, .9);
            min-height: 104px;
        }

        .num-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        .num-ring {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: 2.5px dashed var(--cyan-main);
            padding: 3px;
            box-shadow: 0 0 14px rgba(255, 214, 10, .65);
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            overflow: hidden;
        }

        .num-ring img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        .num-label {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 8.5px;
            color: #fff;
            letter-spacing: 3px;
            margin-top: 6px;
            text-shadow: 0 0 4px rgba(255, 255, 255, .3);
        }

        .pred-divider {
            width: 2px;
            align-self: stretch;
            background: var(--cyan-main);
            box-shadow: 0 0 8px rgba(255, 214, 10, .8);
            border-radius: 2px;
        }

        .pred-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .pred-cap {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 9px;
            color: rgba(255, 255, 255, .55);
            letter-spacing: 2.5px;
        }

        .pred-value {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 28px;
            letter-spacing: 2px;
            margin: 2px 0 6px;
        }

        .pred-value.big {
            color: #00ff4c;
            text-shadow: 0 0 10px #00ff4c, 0 0 25px #00ff4c, 0 0 40px rgba(0, 255, 76, .8);
        }

        .pred-value.small {
            color: #ff0033;
            text-shadow: 0 0 10px #ff0033, 0 0 25px #ff0033, 0 0 40px rgba(255, 0, 51, .8);
        }

        .conf-cap {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 8.5px;
            color: rgba(255, 255, 255, .55);
            letter-spacing: 2px;
        }

        .conf-row {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: 4px;
        }

        .conf-bar {
            flex: 1;
            height: 5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, .12);
            overflow: hidden;
        }

        .conf-fill {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--cyan-dark), var(--cyan-main));
            box-shadow: 0 0 8px rgba(255, 214, 10, .7);
            transition: width .4s ease;
        }

        .conf-pct {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 12px;
            color: #ffd60a;
            text-shadow: 0 0 8px rgba(255, 214, 10, .7);
        }

        .pattern-text {
            font-size: 8px;
            color: #aaa;
            text-align: center;
            margin-top: 6px;
            word-break: break-word;
        }

        /* AUTH PANEL */
        .auth-panel {
            background: rgba(0, 0, 0, .55);
            border: 1px solid rgba(255, 214, 10, .45);
            border-radius: 11px;
            padding: 13px 12px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, .9);
        }

        .auth-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 14px;
            color: var(--cyan-main);
            letter-spacing: 1px;
            text-align: center;
            text-shadow: 0 0 12px rgba(255, 214, 10, .8), 0 0 26px rgba(255, 214, 10, .45);
            margin-bottom: 11px;
        }

        /* BUTTON */
        .btn-row {
            margin-top: 11px;
            position: relative;
            width: 100%;
        }

        .btn {
            width: 100%;
            padding: 12px 0;
            border: none;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 12px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: transform .1s;
            border-radius: 9px;
            text-transform: uppercase;
        }

        .btn:active {
            transform: scale(.96);
        }

        .btn-analyze {
            background: linear-gradient(90deg, #7a5a00 0%, #c9a227 55%, #ffd60a 100%);
            color: #fff;
            text-shadow: 0 0 8px rgba(255, 255, 255, .5);
            box-shadow: 0 0 18px rgba(255, 214, 10, .55);
            border: 1px solid rgba(125, 243, 255, .85);
            border-radius: 8px;
        }

        /* PASSWORD INPUT */
        #pass-input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 214, 10, .55);
            background: rgba(0, 0, 0, .85);
            color: #fff;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            outline: none;
            box-shadow: 0 0 8px rgba(255, 214, 10, .2);
            letter-spacing: 2px;
            user-select: text;
            -webkit-user-select: text;
        }

        #pass-input:focus {
            border-color: #ffd60a;
            box-shadow: 0 0 12px rgba(255, 214, 10, .5);
        }

        #pass-input::placeholder {
            color: #776b3a;
            letter-spacing: 1.5px;
            font-size: 11px;
        }

        /* ─── PREDICTION HISTORY PANEL SPECIFIC STYLES ─── */
        .hist-container {
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 2px;
            touch-action: pan-y;
        }

        .hist-container::-webkit-scrollbar {
            width: 4px;
        }

        .hist-container::-webkit-scrollbar-thumb {
            background: var(--cyan-dark);
            border-radius: 4px;
        }

        .hist-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, .4);
        }

        .hist-item {
            background: rgba(0, 0, 0, .65);
            border: 1px solid rgba(255, 214, 10, .25);
            border-radius: 8px;
            padding: 6px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            font-family: 'Orbitron', sans-serif;
        }

        .hist-period {
            color: #fff;
            font-weight: 700;
            font-size: 10px;
        }

        .hist-pred {
            font-weight: 800;
            color: #fff;
        }

        .hist-result {
            font-weight: 900;
            padding: 2px 5px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .hist-result.win {
            background: rgba(0, 255, 76, .25);
            color: #00ff4c;
            border: 1px solid #00ff4c;
        }

        .hist-result.loss {
            background: rgba(255, 0, 51, .25);
            color: #ff0033;
            border: 1px solid #ff0033;
        }

        .hist-result.jackpot {
            background: linear-gradient(90deg, #ffd60a, #b8860b);
            color: #000;
            box-shadow: 0 0 8px #ffd60a;
            font-weight: 900;
            animation: blink 0.8s infinite;
        }

        /* WATERMARK */
        .club-link {
            text-align: center;
            font-size: 8px;
            color: rgba(255, 214, 10, .45);
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            letter-spacing: 1px;
            margin-top: 9px;
            display: block;
        }

        /* MINI ORB (FOLDING ICON) */
        #mini {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            cursor: grab;
            z-index: 3000;
            touch-action: none;
            top: 0;
            left: 0;
            background: radial-gradient(circle at 30% 28%, var(--neon-cyan) 0%, #7a5a00 45%, #05020a 100%);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, .2), 0 8px 24px rgba(255, 214, 10, .4), inset 0 2px 5px rgba(255, 255, 255, .5);
            animation: none;
            will-change: transform;
            contain: layout paint;
            isolation: isolate;
        }

        #mini.dragging {
            animation: none;
            cursor: grabbing;
        }

        #mini:active {
            cursor: grabbing;
        }

        #mini::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 2px solid var(--neon-cyan);
            opacity: .55;
            animation: pulseRing 1.6s ease-out infinite;
            pointer-events: none;
        }

        #mini img {
            width: 85%;
            height: 85%;
            object-fit: cover;
            border-radius: 50%;
            position: relative;
            z-index: 4;
            pointer-events: none;
        }

        @keyframes floatY {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        @keyframes pulseRing {
            0% {
                transform: scale(1);
                opacity: .8;
            }

            100% {
                transform: scale(1.35);
                opacity: 0;
            }
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .25;
            }
        }
    </style>

</head>
